services:
  tickwatch:
    build: .
    image: tickwatch:local
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      TICKWATCH_DB_PATH: /data/tickwatch.db
      TICKWATCH_LISTEN: ":8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/tickwatch", "healthcheck", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
