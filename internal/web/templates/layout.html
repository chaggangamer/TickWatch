<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Meta.Title}}<title>{{.Meta.Title}} - Tickwatch</title>{{else}}<title>Tickwatch</title>{{end}}
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="brand" href="/">
      <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#2563eb"/>
        <polyline points="8,35 17,35 21,25 26,41 31,46 56,18" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      tickwatch
    </a>
    <div class="nav-links">
      {{if .Meta.CSRF}}
      <a href="/" {{if eq .Meta.Path "/"}}class="active"{{end}}>Monitors</a>
      <a href="/channels" {{if eq .Meta.Path "/channels"}}class="active"{{end}}>Channels</a>
      <a href="/password" {{if eq .Meta.Path "/password"}}class="active"{{end}}>Password</a>
      <form method="post" action="/logout" class="inline-form">
        <input type="hidden" name="_csrf" value="{{.Meta.CSRF}}">
        <button type="submit" class="linklike">Logout</button>
      </form>
      {{else}}
      <a href="/status" {{if eq .Meta.Path "/status"}}class="active"{{end}}>Status page</a>
      {{end}}
    </div>
  </div>
</nav>
<main class="container">
{{template "content" .}}
</main>
<footer class="footer">
  <div class="container">Tickwatch{{if .Meta.Version}} {{.Meta.Version}}{{end}} - uptime and cron monitoring</div>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
